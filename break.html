<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandatory Break - EyeCare Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="break-body">
  <section class="break-overlay">
    <h1>Stop! Take a Break</h1>
    <p>Mandatory health pause is active.</p>
    <div id="breakCountdown" class="big-timer">03:00</div>

    <div id="stepText" class="step">20-20-20: Look 20 feet away for 20 seconds</div>
    <div class="anim-strip">
      <div class="dot"></div>
    </div>

    <div class="actions">
      <button id="completeBreakBtn">Break Completed</button>
      <button id="skipBreakBtn">Skip Break</button>
    </div>
  </section>
  <script src="break.js"></script>
</body>
</html>
