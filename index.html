<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EyeCare Buddy Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>👁️ EyeCare Buddy (Desktop)</h1>
    <p class="lead">Mandatory break enforcement with fullscreen lock window.</p>

    <section class="card">
      <h2>Session Controls</h2>
      <div class="row">
        <button id="startBtn">Start Monitoring</button>
        <button id="stopBtn">Stop Monitoring</button>
      </div>
      <p id="statusText">Status: Idle</p>
      <p id="sessionTimer">Session: 00:00:00</p>
      <p id="breakTimer">Break: --</p>
    </section>

    <section class="card">
      <h2>Customization</h2>
      <div class="grid">
        <label>Session Duration (min)<input id="sessionDurationMin" type="number" min="30" max="120" step="5" /></label>
        <label>Break Duration (min)<input id="breakDurationMin" type="number" min="2" max="10" step="1" /></label>
        <label>Warning Before Lock (sec)<input id="warningBeforeSec" type="number" min="15" max="300" step="15" /></label>
        <label>Strictness
          <select id="strictness">
            <option value="soft">Soft (skip allowed)</option>
            <option value="standard">Standard (skip allowed)</option>
            <option value="strict">Strict (no skip)</option>
          </select>
        </label>
      </div>
      <label><input id="forcedLockMode" type="checkbox" /> Enable forced screen lock mode</label>
      <button id="saveBtn">Save Settings</button>
    </section>

    <section class="card">
      <h2>Analytics</h2>
      <div class="stats">
        <p>Breaks Taken: <strong id="breaksTaken">0</strong></p>
        <p>Breaks Skipped: <strong id="breaksSkipped">0</strong></p>
        <p>Screen Minutes Today: <strong id="screenMinutesToday">0</strong></p>
      </div>
      <canvas id="dailyCanvas" width="540" height="180"></canvas>
    </section>

    <div id="warnBanner" class="warn hidden">⚠ Break lock in 1 minute. Save work now.</div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
